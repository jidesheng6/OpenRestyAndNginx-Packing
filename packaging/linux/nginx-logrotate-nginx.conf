/usr/local/nginx/logs/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        if [ -f /usr/local/nginx/logs/nginx.pid ]; then
            kill -USR1 "$(cat /usr/local/nginx/logs/nginx.pid)" 2>/dev/null || true
        fi
    endscript
}
