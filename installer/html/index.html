<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenResty 已启动</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --border: #262d38;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --link: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background:
      radial-gradient(circle at 20% 0%, rgba(63, 185, 80, .12), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(88, 166, 255, .10), transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main {
    width: min(680px, 100%);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(63, 185, 80, .35);
    background: rgba(63, 185, 80, .08);
    color: var(--accent);
    font-size: 13px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  h1 { margin: 24px 0 8px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -.02em; }
  p { color: var(--muted); line-height: 1.7; margin: 0 0 24px; }
  dl { display: grid; grid-template-columns: 120px 1fr; gap: 12px 16px; margin: 0 0 32px; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: "Cascadia Code", Consolas, monospace; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; }
  a {
    padding: 10px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    color: var(--link);
    text-decoration: none;
    font-size: 14px;
    transition: border-color .15s, background .15s, transform .15s;
  }
  a:hover { border-color: var(--link); background: rgba(88, 166, 255, .08); transform: translateY(-1px); }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <span class="badge"><span class="dot"></span>服务运行正常</span>
  <h1>OpenResty 正在运行</h1>
  <p>安装已成功完成，OpenResty 服务正在监听本机 HTTP 端口。修改 <code>conf/nginx.conf</code> 后可通过开始菜单中的“重启 OpenResty”使配置生效。</p>
  <dl>
    <dt>版本</dt><dd>{{VERSION}}</dd>
    <dt>平台</dt><dd>Windows x64（MinGW64）</dd>
    <dt>健康检查</dt><dd><a href="/healthz">/healthz</a></dd>
    <dt>配置</dt><dd>conf/nginx.conf</dd>
    <dt>日志</dt><dd>logs/error.log</dd>
  </dl>
  <nav>
    <a href="https://openresty.org/en/" target="_blank" rel="noopener">官方文档</a>
    <a href="https://openresty.org/en/changes.html" target="_blank" rel="noopener">更新日志</a>
    <a href="https://github.com/openresty/openresty" target="_blank" rel="noopener">GitHub</a>
  </nav>
  <footer>由 WinSW 作为 Windows 服务“OpenResty”管理。</footer>
</main>
</body>
</html>
